<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="Interesse an dem Bot? Jetzt auf Discord bestellen">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#1DFD85" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1DFD85" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1DFD85"/>
      <stop offset="1" stop-color="#10d670"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="239" rx="16" fill="#0e1110" stroke="#20302a"/>
  <rect x="0.5" y="0.5" width="839" height="239" rx="16" fill="url(#glow)"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="420" y="54" fill="#1DFD85" font-size="13" font-weight="700" letter-spacing="2.6">INTERESSE AN DEM BOT?</text>
    <text x="420" y="96" fill="#ffffff" font-size="30" font-weight="700">Hol dir den Bot für deinen Server</text>
    <text x="420" y="128" fill="#8a9690" font-size="15">Öffne ein Kauf-Ticket auf unserem Discord – wir melden uns schnellstmöglich bei dir.</text>

    <rect x="290" y="158" width="260" height="52" rx="26" fill="#1DFD85" opacity="0.35" filter="url(#blur)"/>
    <rect x="290" y="158" width="260" height="52" rx="26" fill="url(#btn)"/>
    <text x="420" y="190" fill="#0b0d0c" font-size="16" font-weight="800" letter-spacing="1.6">JETZT BESTELLEN  →</text>
  </g>
</svg>
